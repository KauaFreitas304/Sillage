<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<iframe id="testframe" src="index.php" style="width: 375px; height: 667px; border: none;"></iframe>
<pre id="output"></pre>
<script>
window.onload = function() {
  setTimeout(() => {
    try {
      const doc = document.getElementById('testframe').contentDocument;
      const win = document.getElementById('testframe').contentWindow;
      const scrollW = doc.documentElement.scrollWidth;
      const clientW = doc.documentElement.clientWidth;
      const innerW = win.innerWidth;
      let out = `Viewport: innerWidth=${innerW}, clientWidth=${clientW}, scrollWidth=${scrollW}\n`;
      if (scrollW > innerW) {
        out += `OVERFLOW DETECTED: scrollWidth (${scrollW}) > innerWidth (${innerW})\n`;
      }
      const all = doc.querySelectorAll('*');
      for (const el of all) {
        const rect = el.getBoundingClientRect();
        if (rect.right > innerW + 1 || el.scrollWidth > innerW + 1) {
          out += `Element overflowing: <${el.tagName.toLowerCase()} class="${el.className}" id="${el.id}"> rect.right=${rect.right.toFixed(1)}, scrollWidth=${el.scrollWidth}, offsetWidth=${el.offsetWidth}\n`;
        }
      }
      document.getElementById('output').textContent = out;
      console.log(out);
    } catch(e) {
      document.getElementById('output').textContent = e.message;
    }
  }, 1000);
};
</script>
</body>
</html>
