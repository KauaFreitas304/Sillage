<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="grad-baccarat.svg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="#EAE5D9"/>
  <!-- Suporte e base -->
  <ellipse cx="300" cy="510" rx="190" ry="24" fill="#9FAF90" opacity="0.3"/>
  <ellipse cx="300" cy="505" rx="140" ry="16" fill="#5C6B5E" opacity="0.25"/>
  
  <!-- Frasco de Perfume Estilizado -->
  <g filter="url(#shadow)">
    <!-- Tampa / Borrifador -->
    <rect x="272" y="140" width="56" height="40" rx="4" fill="#F2DCB1" stroke="#5C6B5E" stroke-width="2"/>
    <rect x="286" y="115" width="28" height="25" rx="3" fill="#D4AF37"/>
    <ellipse cx="300" cy="115" rx="14" ry="4" fill="#F2DCB1"/>
    
    <!-- Ombro do frasco -->
    <path d="M 240 210 L 272 180 L 328 180 L 360 210 Z" fill="#7B1113"/>
    
    <!-- Corpo Principal do Frasco -->
    <rect x="220" y="210" width="160" height="260" rx="20" fill="#7B1113"/>
    <rect x="220" y="210" width="160" height="260" rx="20" fill="url(#grad-baccarat.svg)"/>
    
    <!-- Rótulo Dourado / Champagne -->
    <rect x="245" y="270" width="110" height="130" rx="6" fill="#F2DCB1" stroke="#F2DCB1" stroke-width="1.5"/>
    <text x="300" y="305" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" font-weight="bold" fill="#5C6B5E" text-anchor="middle" letter-spacing="2">MAISON FRANCIS KURKDJIAN</text>
    <line x1="260" y1="318" x2="340" y2="318" stroke="#9FAF90" stroke-width="1"/>
    <text x="300" y="342" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#3D4849" text-anchor="middle">Baccarat Rouge 540</text>
    <text x="300" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#5C6B5E" text-anchor="middle" letter-spacing="1">EAU DE PARFUM</text>
    <text x="300" y="385" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#7A8B7C" text-anchor="middle">SILLAGE COLLECTION</text>
  </g>
  
  <!-- Aura de fragrância (Sillage) -->
  <path d="M 120 180 Q 180 120 280 150 Q 380 180 470 120" stroke="#F2DCB1" stroke-width="2.5" fill="none" opacity="0.6" stroke-dasharray="6,4"/>
  <path d="M 140 220 Q 210 160 300 200 Q 390 240 460 180" stroke="#F2DCB1" stroke-width="2" fill="none" opacity="0.5"/>
</svg>